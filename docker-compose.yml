# Local development stack for KernelQ (Postgres + Kafka + Redis + Prometheus + Grafana).
#
# Start all services:
#   docker compose up -d
#
# Start only Postgres (no broker):
#   docker compose up -d postgres
#
# Logs:
#   docker compose logs -f postgres
#   docker compose logs -f kafka
#
# Why Kafka in KernelQ:
#   The Python control plane schedules jobs and persists state in Postgres.
#   Go workers execute jobs. Kafka sits between them as a durable buffer:
#   schedulers publish "run this job" events; workers consume when ready.
#   See docs/decisions/ADR-0002-kafka-choice.md.
#
# Zookeeper vs Kafka (beginner summary):
#   - Zookeeper: coordination service Kafka uses (in this classic setup) to
#     track broker metadata, leader election, and cluster configuration.
#   - Kafka: the message broker — append-only topics that store dispatch events
#     until Go workers read them. Host clients connect on localhost:9092.

services:
  postgres:
    image: postgres:16
    container_name: kernelq-postgres
    environment:
      POSTGRES_DB: kernelq
      POSTGRES_USER: kernelq
      POSTGRES_PASSWORD: kernelq_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kernelq_postgres_data:/var/lib/postgresql/data

  # Zookeeper: helps Kafka brokers agree on cluster state (metadata, leaders).
  # KernelQ needs it here because this local stack uses the traditional
  # Zookeeper-backed Kafka mode — simple and widely documented for learning.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: kernelq-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka: durable log between the Python scheduler and Go workers.
  # Producers (control plane) write dispatch events; consumers (workers) read them.
  # PLAINTEXT listeners only — fine for local dev, not for production.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kernelq-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: internal (docker network) and external (your laptop).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker dev settings (replication factor 1 is OK locally).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Redis: fast dedupe / idempotency keys (future control-plane and worker paths).
  redis:
    image: redis:7
    container_name: kernelq-redis
    ports:
      - "6379:6379"

  # Prometheus: pulls job-state gauges from the control-plane API on the host.
  # Start FastAPI on port 8000 first; scrape target is host.docker.internal in prometheus.yml.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kernelq-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Grafana: dashboards for Prometheus metrics (local dev credentials only).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: kernelq-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  kernelq_postgres_data:
