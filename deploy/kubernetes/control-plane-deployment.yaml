apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernelq-control-plane
  namespace: kernelq
  labels:
    app.kubernetes.io/name: kernelq-control-plane
    app.kubernetes.io/part-of: kernelq
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kernelq-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kernelq-control-plane
        app.kubernetes.io/part-of: kernelq
        app.kubernetes.io/component: control-plane
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: api
          image: kernelq-control-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kernelq-secrets
                  key: DATABASE_URL
                  optional: true
          envFrom:
            - configMapRef:
                name: kernelq-config
                optional: true
            - secretRef:
                name: kernelq-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
