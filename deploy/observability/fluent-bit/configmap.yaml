# Fluent Bit pipeline: Kubernetes container logs → parse KernelQ JSON → CloudWatch-oriented output.
# Placeholders AWS_REGION / CLOUDWATCH_LOG_GROUP / CLOUDWATCH_LOG_STREAM_PREFIX come from DaemonSet env.
# No AWS account IDs or credentials are embedded here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kernelq-fluent-bit-config
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kernelq
    app.kubernetes.io/component: logging-collector
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        DB                /var/fluent-bit/state/flb_kube.db

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              Off
        Annotations         Off

    [FILTER]
        Name         parser
        Match        kube.*
        Key_Name     log_processed
        Parser       kernelq_json
        Reserve_Data On
        Preserve_Key Off

    [FILTER]
        Name    modify
        Match   kube.*
        Remove  log
        Remove  stream
        Remove  _p
        Remove  authorization
        Remove  password
        Remove  token
        Remove  raw_payload
        Remove  redis_url
        Remove  connection_string

    [OUTPUT]
        Name                cloudwatch_logs
        Match               *
        region              ${AWS_REGION}
        log_group_name      ${CLOUDWATCH_LOG_GROUP}
        log_stream_prefix   ${CLOUDWATCH_LOG_STREAM_PREFIX}
        auto_create_group   false
        retry_limit         2

  parsers.conf: |
    [PARSER]
        Name        kernelq_json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
