# Dedicated Fluent Bit collector identity (Day 127).
# Do not reuse KernelQ application service accounts.
# Do not mount static AWS access keys.
#
# For EKS Pod Identity / IRSA, set the role annotation in the
# eks-observability overlay patch (placeholder ARN only — never commit a real account).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernelq-fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kernelq
    app.kubernetes.io/component: logging-collector
